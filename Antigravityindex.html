  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --g-blue: #1a73e8;
      --g-blue-bg: #f0f6ff;
      --g-blue-border: #d2e3fc;
      --g-green: #188038;
      --g-green-bg: #eef9f1;
      --g-green-border: #ceead6;
      --g-yellow: #b06000;
      --g-yellow-bg: #fef7e0;
      --g-yellow-border: #feefc3;
      --g-red: #c5221f;
      --g-red-bg: #fce8e6;

      --text-main: #202124;
      --text-body: #3c4043;
      --text-muted: #5f6368;
      --bg-page: #ffffff;
      --bg-surface: #f8f9fa;
      --border-light: #e8eaed;
      --border-std: #dadce0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans KR', 'Google Sans', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      line-height: 1.74;
      word-break: keep-all;
      -webkit-font-smoothing: antialiased;
    }

    code, pre {
      font-family: 'Roboto Mono', monospace;
      font-size: 0.92em;
      background: #f1f3f4;
      padding: 2px 6px;
      border-radius: 5px;
    }

    .google-top-stripe {
      height: 4px;
      width: 100%;
      background: linear-gradient(90deg, #4285F4 0% 25%, #EA4335 25% 50%, #FBBC04 50% 75%, #34A853 75% 100%);
    }

    /* Editorial Header */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-light);
      padding: 14px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand-lockup {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-lockup img.official-lockup {
      height: 32px;
      width: auto;
      display: block;
    }

    .header-divider {
      width: 1px;
      height: 20px;
      background: var(--border-std);
    }

    .header-subtitle {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .header-nav {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .header-nav a {
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-muted);
      transition: color 0.15s;
    }

    .header-nav a:hover {
      color: var(--g-blue);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .lang-switch {
      display: inline-flex;
      border: 1px solid var(--border-std);
      border-radius: 999px;
      overflow: hidden;
      background: var(--bg-surface);
    }

    .lang-btn {
      border: none;
      background: transparent;
      padding: 6px 14px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
    }

    .lang-btn.active {
      background: var(--g-blue);
      color: #ffffff;
    }

    /* Main Wrapper */
    .guide-wrapper {
      max-width: 980px;
      margin: 0 auto;
      padding: 48px 28px 96px;
    }

    /* Hero Section */
    .hero-block {
      padding-bottom: 44px;
      border-bottom: 1px solid var(--border-light);
      margin-bottom: 48px;
    }

    .hero-brand-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .hero-brand-row img {
      height: 42px;
      width: auto;
    }

    .pill-label {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      color: var(--g-blue);
      background: var(--g-blue-bg);
      padding: 4px 12px;
      border-radius: 999px;
    }

    .hero-block h1 {
      font-size: 33px;
      line-height: 1.34;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 16px;
      letter-spacing: -0.02em;
    }

    .hero-block p.lead {
      font-size: 18px;
      line-height: 1.85;
      color: var(--text-body);
      max-width: 740px;
      margin-bottom: 14px;
      letter-spacing: -0.006em;
    }

    .hero-block p.lead-sub {
      font-size: 15.5px;
      line-height: 1.8;
      color: var(--text-muted);
      max-width: 740px;
      margin-bottom: 30px;
      letter-spacing: -0.004em;
    }

    /* Hero: Plan -> Act -> Verify mini cards */
    .hero-flow-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 30px;
    }

    @media (max-width: 740px) {
      .hero-flow-row {
        grid-template-columns: 1fr;
      }
    }

    .hero-flow-card {
      position: relative;
      background: #ffffff;
      border: 1px solid var(--border-std);
      border-radius: 12px;
      padding: 16px 18px 17px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .hero-flow-card:hover {
      border-color: var(--g-blue-border);
      box-shadow: 0 2px 10px rgba(26,115,232,0.08);
    }

    .hero-flow-card .flow-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--g-blue-bg);
      color: var(--g-blue);
      font-size: 11.5px;
      font-weight: 700;
      margin-bottom: 9px;
    }

    .hero-flow-card .flow-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 5px;
      letter-spacing: -0.01em;
    }

    .hero-flow-card .flow-desc {
      font-size: 13.5px;
      line-height: 1.65;
      color: var(--text-muted);
    }

    .hero-track-heading {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .concept-comparison-box {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      background: var(--bg-surface);
      border: 1px solid var(--border-std);
      border-radius: 16px;
      padding: 24px;
    }

    @media (max-width: 740px) {
      .concept-comparison-box {
        grid-template-columns: 1fr;
      }
      .header-nav {
        display: none;
      }
    }

    .concept-col {
      padding: 8px;
    }

    .concept-col.highlight {
      background: #ffffff;
      border: 1px solid var(--g-blue-border);
      border-radius: 12px;
      padding: 18px 20px;
      box-shadow: 0 2px 8px rgba(26,115,232,0.06);
    }

    .concept-col h3 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .concept-col p {
      font-size: 14.5px;
      color: var(--text-body);
    }

    /* Chapters */
    .chapter {
      margin-bottom: 56px;
      padding-bottom: 48px;
      border-bottom: 1px solid var(--border-light);
    }

    .chapter:last-child {
      border-bottom: none;
      margin-bottom: 0;
    }

    .chapter-number {
      font-size: 12.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--g-blue);
      margin-bottom: 6px;
    }

    .chapter h2 {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 12px;
      letter-spacing: -0.01em;
    }

    .chapter p.section-intro {
      font-size: 15.5px;
      color: var(--text-body);
      margin-bottom: 26px;
      max-width: 860px;
    }

    /* INTERACTIVE DIAGRAM 1: Plan -> Act -> Verify */
    .flow-diagram-box {
      border: 1px solid var(--border-std);
      border-radius: 16px;
      background: #ffffff;
      overflow: hidden;
    }

    .flow-steps-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-std);
    }

    .flow-step-btn {
      padding: 18px 20px;
      border: none;
      border-right: 1px solid var(--border-std);
      background: transparent;
      text-align: left;
      cursor: pointer;
      transition: background 0.15s;
      display: flex;
      align-items: center;
      gap: 14px;
      font-family: inherit;
    }

    .flow-step-btn:last-child {
      border-right: none;
    }

    .flow-step-btn:hover {
      background: #f1f3f4;
    }

    .flow-step-btn.active {
      background: #ffffff;
      border-bottom: 3px solid var(--g-blue);
    }

    .step-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #e8eaed;
      color: var(--text-main);
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .flow-step-btn.active .step-circle {
      background: var(--g-blue);
      color: #ffffff;
    }

    .flow-content-panel {
      padding: 28px;
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 26px;
      align-items: center;
    }

    @media (max-width: 760px) {
      .flow-steps-bar, .flow-content-panel {
        grid-template-columns: 1fr;
      }
    }

    .role-split {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .role-card {
      padding: 16px 18px;
      border-radius: 12px;
      font-size: 14px;
    }

    .role-you {
      background: var(--g-blue-bg);
      border: 1px solid var(--g-blue-border);
    }

    .role-agent {
      background: var(--g-green-bg);
      border: 1px solid var(--g-green-border);
    }

    .visual-example-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-std);
      border-radius: 12px;
      padding: 20px;
      font-size: 13.5px;
    }

    /* INTERACTIVE DIAGRAM 2: 4 Surfaces Tabs */
    .surface-tabs-row {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .surface-pill {
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 999px;
      border: 1px solid var(--border-std);
      background: var(--bg-surface);
      color: var(--text-body);
      cursor: pointer;
      transition: all 0.15s;
    }

    .surface-pill:hover {
      border-color: var(--g-blue);
      color: var(--g-blue);
    }

    .surface-pill.active {
      background: var(--g-blue);
      color: #ffffff;
      border-color: var(--g-blue);
    }

    .surface-display-card {
      border: 1px solid var(--border-std);
      border-radius: 16px;
      padding: 28px;
      background: #ffffff;
      display: grid;
      grid-template-columns: 1.18fr 0.82fr;
      gap: 28px;
      align-items: center;
    }

    @media (max-width: 760px) {
      .surface-display-card {
        grid-template-columns: 1fr;
      }
    }

    .callout-note {
      margin-top: 16px;
      background: var(--g-yellow-bg);
      border: 1px solid var(--g-yellow-border);
      border-radius: 12px;
      padding: 14px 18px;
      font-size: 13.5px;
      color: var(--text-body);
    }

    /* Features Grid */
    .features-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    @media (max-width: 720px) {
      .features-grid {
        grid-template-columns: 1fr;
      }
    }

    .feature-item {
      border: 1px solid var(--border-std);
      border-radius: 14px;
      padding: 22px 24px;
      background: #ffffff;
    }

    .feature-item h3 {
      font-size: 16.5px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .feature-item p {
      font-size: 14px;
      color: var(--text-body);
    }

    /* INTERACTIVE DIAGRAM 3: 3-Layer Stack */
    .stack-diagram {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .stack-tier {
      border: 1.5px solid var(--border-std);
      border-radius: 14px;
      padding: 20px 24px;
      background: #ffffff;
      cursor: pointer;
      transition: all 0.18s;
    }

    .stack-tier:hover {
      border-color: var(--g-blue);
    }

    .stack-tier.active {
      border-color: var(--g-blue);
      background: var(--g-blue-bg);
    }

    .tier-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      gap: 12px;
    }

    .tier-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
    }

    .tier-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tier-chip {
      background: #ffffff;
      border: 1px solid var(--border-std);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-body);
    }

    .stack-explanation-panel {
      background: var(--bg-surface);
      border-left: 4px solid var(--g-blue);
      border-radius: 8px;
      padding: 20px 24px;
      font-size: 14.5px;
      color: var(--text-body);
    }

    /* Value Cards & Table */
    .value-highlights {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 28px;
    }

    @media (max-width: 760px) {
      .value-highlights {
        grid-template-columns: 1fr;
      }
    }

    .value-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-std);
      border-radius: 14px;
      padding: 20px;
    }

    .value-card .big-metric {
      font-size: 19px;
      font-weight: 700;
      color: var(--g-blue);
      margin-bottom: 8px;
    }

    .comparison-table-wrapper {
      overflow-x: auto;
      border: 1px solid var(--border-std);
      border-radius: 14px;
    }

    table.clean-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.8px;
      text-align: left;
    }

    table.clean-table th, table.clean-table td {
      padding: 15px 16px;
      border-bottom: 1px solid var(--border-light);
      vertical-align: top;
    }

    table.clean-table th {
      background: var(--bg-surface);
      font-weight: 700;
      color: var(--text-main);
    }

    table.clean-table th.agy-col, table.clean-table td.agy-col {
      background: var(--g-blue-bg);
      border-left: 1px solid var(--g-blue-border);
    }

    .verdict-badge {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 700;
    }

    .verdict-true {
      background: var(--g-green-bg);
      color: var(--g-green);
      border: 1px solid var(--g-green-border);
    }

    .verdict-caveat {
      background: var(--g-blue-bg);
      color: var(--g-blue);
      border: 1px solid var(--g-blue-border);
    }
  </style>
</head>

            agentText: '\uc18c\uc2a4\ucf54\ub4dc\ub97c \uc784\uc758\ub85c \uc218\uc815\ud558\uae30 \uc804\uc5d0 \ub808\ud3ec\uc9c0\ud1a0\ub9ac \uad6c\uc870\uc640 \uc758\uc874\uc131\uc744 \uba3c\uc800 \ubd84\uc11d\ud569\ub2c8\ub2e4. \uc218\uc815 \ub300\uc0c1 \ud30c\uc77c, API \uc2a4\ud0a4\ub9c8 \ubcc0\uacbd\uc548, \ud14c\uc2a4\ud2b8 \uc2dc\ub098\ub9ac\uc624\ub97c \uc815\ub9ac\ud55c \uacc4\ud68d\uc11c \uc544\ud2f0\ud329\ud2b8\ub97c \uc0dd\uc131\ud574 \uc0ac\uc804 \ud569\uc758\ub97c \uc694\uccad\ud569\ub2c8\ub2e4.',

            chips: ['\uc791\uc5c5 \ud3f4\ub354 \uc678\ubd80 \ud30c\uc77c \uc811\uadfc (Deny / Always ask / Allow)', '\ud130\ubbf8\ub110 \uc790\ub3d9 \uc2e4\ud589 \ubaa8\ub4dc & \uc0cc\ub4dc\ubc15\uc2a4 \ubaa8\ub4dc \ud1a0\uae00', 'OS \uc218\uc900 \uc0cc\ub4dc\ubc15\uc2a4 (macOS \u00b7 Linux / Windows Preview)', '\ube0c\ub77c\uc6b0\uc800 URL \u00b7 JS \uc2e4\ud589 \ubc0f MCP \uc11c\ubc84 \ud5c8\uc6a9 \ubaa9\ub85d'],
            explanation: '<strong>[Layer 2 \u2014 \uad00\ub9ac\uc790 \ucf54\ub529 \ud1b5\uc81c(Admin Coding Controls)]</strong> IT\u00b7\ubcf4\uc548 \uad00\ub9ac\uc790\uac00 Google Cloud Console\uc758 <code>Gemini Enterprise \u203a Settings \u203a AI developer tools</code> \ud0ed\uc5d0\uc11c \uc804\uc0ac \uac00\ub4dc\ub808\uc77c\uc744 \uad6c\uc131\ud569\ub2c8\ub2e4.<br/>\u2022 <strong>\uc791\uc5c5 \ud3f4\ub354 \uc678\ubd80 \ud30c\uc77c \uc811\uadfc:</strong> <code>Deny</code>(\ucd5c\ucd08 \uc124\uc815 \uc2dc \uae30\ubcf8\uac12) / <code>Always ask</code> / <code>Allow</code> \uc911 \uc9c0\uc815\ud574 \ud504\ub85c\uc81d\ud2b8 \ud3f4\ub354 \ubc16\uc758 \ud30c\uc77c \uc811\uadfc\uc744 \ud1b5\uc81c\ud569\ub2c8\ub2e4.<br/>\u2022 <strong>\ud130\ubbf8\ub110 \uc2e4\ud589 \ubc0f \uc0cc\ub4dc\ubc15\uc2a4 \uc8fc\uc758\uc0ac\ud56d:</strong> Cloud Console\uc5d0\uc11c <code>Terminal auto-execution mode</code>(\uae30\ubcf8\uac12: <code>Always proceed</code>)\uc640 <code>Sandbox mode</code>(\ubcc4\ub3c4 \ud1a0\uae00, \uae30\ubcf8\uac12: <code>Disabled</code>)\ub294 \uac1c\ubcc4 \uc124\uc815\uc785\ub2c8\ub2e4. \uc0cc\ub4dc\ubc15\uc2a4 \uaca9\ub9ac\ub97c \uac15\uc81c\ud558\ub824\uba74 \ubc18\ub4dc\uc2dc <code>Sandbox mode</code>\ub97c \ud65c\uc131\ud654\ud558\uace0 <code>Proceed in sandbox</code> \ub610\ub294 <code>Require review</code>\ub85c \ubcc0\uacbd\ud558\uc138\uc694(OS \ub124\uc774\ud2f0\ube0c \uc0cc\ub4dc\ubc15\uc2a4\ub294 macOS\u00b7Linux \uc9c0\uc6d0, Windows\ub294 Preview).<br/>\u2022 <strong>\ube0c\ub77c\uc6b0\uc800 \u00b7 MCP \u00b7 \uac10\uc0ac \ub85c\uae45:</strong> <code>Browser access</code>, <code>Browser JavaScript auto-execution</code>, <code>MCP servers</code>, <code>Prompts and responses logging</code>\uc740 \ubaa8\ub450 \uae30\ubcf8\uac12\uc774 <code>Disabled</code>\uc774\ubbc0\ub85c \ubc30\ud3ec \uc804 \uc870\uc9c1 \ubcf4\uc548 \uae30\uc900\uc5d0 \ub9de\uac8c \uba85\uc2dc\uc801\uc73c\ub85c \uad6c\uc131\ud574\uc57c \ud569\ub2c8\ub2e4.'

            <span class="pill-label">${c.heroBadge}</span>
          </div>
          <h1>${c.heroTitle}</h1>
          <p class="lead">${c.heroLead}</p>
          <p class="lead-sub">${c.heroLeadSub}</p>

          <div class="hero-flow-row">
            ${c.heroFlow.map((f, i) => `
              <div class="hero-flow-card">
                <span class="flow-num">${i + 1}</span>
                <div class="flow-name">${f.name}</div>
                <div class="flow-desc">${f.desc}</div>
              </div>
            `).join('')}
          </div>

          <div class="hero-track-heading">${c.heroTrackHeading}</div>

          <div class="concept-comparison-box">
            <div class="concept-col highlight">
              <h3><span style="color:var(--g-blue);">\u2726</span> ${c.compRightTitle}</h3>
              <p>${c.compRightBody}</p>
            </div>
            <div class="concept-col">
              <h3><span style="color:var(--text-muted);">\u25cb</span> ${c.compLeftTitle}</h3>
              <p>${c.compLeftBody}</p>
            </div>
          </div>
        </section>

        <!-- SECTION 1 -->
        <section class="chapter" id="overview">
          <div class="chapter-number">${c.s1Num}</div>
          <h2>${c.s1Title}</h2>
          <p class="section-intro">${c.s1Intro}</p>

          <div class="flow-diagram-box">
            <div class="flow-steps-bar">
              ${c.steps.map((st, i) => `
                <button class="flow-step-btn ${i === activeStep ? 'active' : ''}" onclick="setStep(${i})">
                  <span class="step-circle">${i + 1}</span>
                  <div>
                    <div style="font-weight:700;font-size:15px;">${st.name}</div>
                    <div style="font-size:12.5px;color:var(--text-muted);">${st.sub}</div>
                  </div>
                </button>
              `).join('')}
            </div>
            <div class="flow-content-panel">
              <div class="role-split">
                <div class="role-card role-you">
                  <div style="font-weight:700;margin-bottom:4px;color:var(--g-blue);">${c.steps[activeStep].youTitle}</div>
                  <div>${c.steps[activeStep].youText}</div>
                </div>
                <div class="role-card role-agent">
                  <div style="font-weight:700;margin-bottom:4px;color:var(--g-green);">${c.steps[activeStep].agentTitle}</div>
                  <div>${c.steps[activeStep].agentText}</div>
                </div>
              </div>
              <div class="visual-example-card">
                <div style="font-weight:700;margin-bottom:10px;color:var(--text-main);border-bottom:1px solid var(--border-std);padding-bottom:8px;">${c.steps[activeStep].exTitle}</div>
                <div style="line-height:1.65;color:var(--text-body);">${c.steps[activeStep].exBody}</div>
              </div>
            </div>
          </div>
        </section>

        <!-- SECTION 2 -->
        <section class="chapter" id="surfaces">
          <div class="chapter-number">${c.s2Num}</div>
          <h2>${c.s2Title}</h2>
          <p class="section-intro">${c.s2Intro}</p>

          <div class="surface-tabs-row">
            ${c.surfaceTabs.map((tab, i) => `
              <button class="surface-pill ${i === activeSurface ? 'active' : ''}" onclick="setSurface(${i})">${tab}</button>
            `).join('')}
          </div>

          <div class="surface-display-card">
            <div>
              <div style="font-size:13px;font-weight:600;color:var(--g-blue);margin-bottom:6px;">${c.surfaces[activeSurface].who}</div>
              <h3 style="font-size:20px;margin-bottom:10px;">${c.surfaces[activeSurface].title}</h3>
              <p style="font-size:14.5px;color:var(--text-body);">${c.surfaces[activeSurface].body}</p>
            </div>
            <div style="background:var(--bg-surface);border:1px solid var(--border-std);border-radius:12px;padding:18px 20px;">
              <div style="font-weight:700;font-size:13.5px;margin-bottom:8px;color:var(--text-main);">${currentLang === 'ko' ? '\ud575\uc2ec \ud2b9\uc9d5 \ubc0f \ub77c\uc774\uc120\uc2a4 \uae30\uc900:' : 'Key Highlights & Licensing:'}</div>
              <ul style="padding-left:18px;font-size:13.5px;color:var(--text-body);display:flex;flex-direction:column;gap:8px;">
                ${c.surfaces[activeSurface].points.map(p => `<li>${p}</li>`).join('')}
              </ul>
            </div>
          </div>

          <div class="callout-note">
            ${c.surfaceCaveat}
          </div>
        </section>

        <!-- SECTION 3 -->
        <section class="chapter" id="features">
          <div class="chapter-number">${c.s3Num}</div>
          <h2>${c.s3Title}</h2>
          <p class="section-intro">${c.s3Intro}</p>

          <div class="features-grid">
            ${c.features.map(f => `
              <div class="feature-item">
                <h3><span style="color:${f.color};">${f.num}</span> ${f.title}</h3>
                <p>${f.desc}</p>
              </div>
            `).join('')}
          </div>
        </section>

        <!-- SECTION 4 -->
        <section class="chapter" id="architecture">
          <div class="chapter-number">${c.s4Num}</div>
          <h2>${c.s4Title}</h2>
          <p class="section-intro">${c.s4Intro}</p>

          <div class="stack-diagram">
            ${c.tiers.map((t, i) => `
              <div class="stack-tier ${i === activeTier ? 'active' : ''}" onclick="setTier(${i})">
                <div class="tier-header">
                  <span class="tier-title">${t.title}</span>
                  <span class="pill-label">${t.badge}</span>
                </div>
                <div class="tier-chips">
                  ${t.chips.map(ch => `<span class="tier-chip">${ch}</span>`).join('')}
                </div>
              </div>
            `).join('')}
          </div>

          <div class="stack-explanation-panel">
            ${c.tiers[activeTier].explanation}
          </div>
        </section>

        <!-- SECTION 5 -->
        <section class="chapter" id="differentiation">
          <div class="chapter-number">${c.s5Num}</div>
          <h2>${c.s5Title}</h2>
          <p class="section-intro">${c.s5Intro}</p>

          <div class="value-highlights">
            ${c.values.map(v => `
              <div class="value-card">
                <div class="big-metric" style="color:${v.color};">${v.metric}</div>
                <p style="font-size:13.5px;color:var(--text-body);">${v.desc}</p>
              </div>
            `).join('')}
          </div>

          <div class="comparison-table-wrapper">
            <table class="clean-table">
              <thead>
                <tr>
                  <th style="width:34%;">${c.tableHeaders[0]}</th>
                  <th class="agy-col" style="width:66%;">${c.tableHeaders[1]}</th>
                </tr>
              </thead>
              <tbody>
                ${c.tableRows.map(row => `
                  <tr>
                    <td>${row[0]}</td>
                    <td class="agy-col">${row[1]}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </section>

        <!-- SECTION 6 -->
        <section class="chapter" id="faq">
          <div class="chapter-number">${c.s6Num}</div>
          <h2>${c.s6Title}</h2>
          <p class="section-intro">${c.s6Intro}</p>

          <div class="comparison-table-wrapper">
            <table class="clean-table">
              <thead>
                <tr>
                  <th style="width:22%;">${c.factHeaders[0]}</th>
                  <th style="width:16%;">${c.factHeaders[1]}</th>
                  <th style="width:44%;">${c.factHeaders[2]}</th>
                  <th style="width:18%;">${c.factHeaders[3]}</th>
                </tr>
              </thead>
              <tbody>
                ${c.factRows.map(row => `
                  <tr>
                    <td>${row[0]}</td>
                    <td>${row[1]}</td>
                    <td>${row[2]}</td>
                    <td>${row[3]}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </section>
      `;
    }

    function setLang(lang) {
      currentLang = lang;
      document.documentElement.lang = lang;
      document.getElementById('btn-ko').classList.toggle('active', lang === 'ko');
      document.getElementById('btn-en').classList.toggle('active', lang === 'en');
      document.querySelectorAll('[data-ko]').forEach(el => {
        el.textContent = el.getAttribute('data-' + lang);
      });
      renderAll();
    }

    function setStep(idx) {
      activeStep = idx;
      renderAll();
    }

    function setSurface(idx) {
      activeSurface = idx;
      renderAll();
    }

    function setTier(idx) {
      activeTier = idx;
      renderAll();
    }

    renderAll();
    if (window.location.hash) {
      const targetEl = document.querySelector(window.location.hash);
      if (targetEl) {
        requestAnimationFrame(() => targetEl.scrollIntoView({ behavior: 'smooth', block: 'start' }));
      }
    }
  </script>
</body>
</html>
