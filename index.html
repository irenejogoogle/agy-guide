/* ============================================================
   Google Antigravity · Enterprise guide — design system
   Tokens: surface / content / accent / signal, light + dark.
   Contrast figures are against the surface they sit on.
   ============================================================ */
:root {
  --surface: #ffffff;            /* page */
  --surface-2: #f6f8fa;          /* cards, rails */
  --surface-3: #eaf1fd;          /* accent tint */
  --surface-4: #e6f4ea;          /* verified tint */
  --surface-5: #fef3e2;          /* caution tint */
  --ink: #1f1f1f;                /* 16.3:1 */
  --ink-2: #3c4043;              /* 10.5:1 */
  --ink-3: #5f6368;              /* 6.0:1 */
  --rule: #dadce0;
  --rule-2: #e8eaed;
  --accent-fill: #1a73e8;        /* white text 4.5:1 */
  --accent-text: #1967d2;        /* 5.4:1 on surface */
  --accent-on-tint: #185abc;     /* 6.0:1 on surface-3 */
  --accent-border: #c6dafc;
  --ok-text: #137333;            /* 5.5:1 on surface-4 */
  --ok-border: #ceead6;
  --warn-text: #b06000;          /* 4.6:1 on surface */
  --warn-border: #fde293;
  --danger-text: #c5221f;
  --code-bg: #f1f3f4;
  --focus: #1a73e8;
  --shadow: 0 1px 2px rgba(60,64,67,.12), 0 2px 8px rgba(60,64,67,.08);
  --radius: 14px; --radius-s: 8px;
  --font-sans: 'Noto Sans KR', 'Google Sans', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surface: #121417; --surface-2: #1b1f24; --surface-3: #1e2a3f; --surface-4: #16301f; --surface-5: #3a2a0c;
    --ink: #e8eaed;      /* 14.8:1 */
    --ink-2: #c4c7cc;    /* 9.9:1 */
    --ink-3: #9aa0a6;    /* 6.1:1 */
    --rule: #3c4043; --rule-2: #2b2f33;
    --accent-fill: #8ab4f8;  /* #121417 text 7.9:1 */
    --accent-text: #8ab4f8;  /* 7.9:1 */
    --accent-on-tint: #8ab4f8;
    --accent-border: #2f4a73;
    --ok-text: #81c995; --ok-border: #2b5a3a;
    --warn-text: #fdd663; --warn-border: #6b4c0a;
    --danger-text: #f28b82;
    --code-bg: #23272b;
    --focus: #8ab4f8;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 2px 8px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}

/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 84px; }
body { margin: 0; font-family: var(--font-sans); font-size: 16px; line-height: 1.7; color: var(--ink); background: var(--surface); -webkit-font-smoothing: antialiased;
       word-break: keep-all; overflow-wrap: break-word; /* Korean: wrap between words, never inside a word; long tokens still break as a last resort */ }
h1, h2, h3, h4 { margin: 0; color: var(--ink); word-break: keep-all; overflow-wrap: anywhere; letter-spacing: -0.01em; }
h1 { font-size: clamp(30px, 4.2vw, 42px); line-height: 1.25; font-weight: 700; letter-spacing: -0.02em; }
h1 .h1-name { display: block; color: var(--accent-text); margin-bottom: 4px; }
h2 { font-size: clamp(24px, 2.6vw, 30px); line-height: 1.3; font-weight: 700; }
h3 { font-size: 19px; line-height: 1.4; font-weight: 700; }
p { margin: 0; color: var(--ink-2); }
a { color: var(--accent-text); text-decoration-thickness: 1px; text-underline-offset: 3px; }
a:hover { text-decoration-thickness: 2px; }
code, .mono { font-family: var(--font-mono); font-size: .92em; }
code { background: var(--code-bg); padding: 2px 6px; border-radius: 5px; color: var(--ink); }
button { font: inherit; color: inherit; }
button:active { transform: translateY(1px); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
img { max-width: 100%; }
strong { color: var(--ink); font-weight: 700; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.skip-link { position: absolute; left: 12px; top: -60px; background: var(--accent-fill); color: #fff; padding: 10px 14px; border-radius: 8px; z-index: 200; font-weight: 700; }
.skip-link:focus { top: 12px; }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

/* icons */
.ms { font-family: 'Material Symbols Outlined'; font-weight: normal; font-style: normal; font-size: 20px; line-height: 1; letter-spacing: normal; text-transform: none; display: inline-block; white-space: nowrap; direction: ltr; vertical-align: -4px; font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20; -webkit-font-smoothing: antialiased; }
.ms.ms-sm { font-size: 18px; vertical-align: -3px; }
.ms.ms-lg { font-size: 24px; vertical-align: -5px; font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }

/* ---------- header ---------- */
.stripe { height: 4px; background: linear-gradient(90deg, #4285F4 0 25%, #EA4335 25% 50%, #FBBC04 50% 75%, #34A853 75% 100%); }
.site-header { position: sticky; top: 0; z-index: 100; background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--rule-2); }
.header-inner { max-width: 1180px; margin: 0 auto; padding: 10px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
.brand img { height: 30px; width: auto; display: block; }
@media (prefers-color-scheme: dark) { .brand img { background: #fff; padding: 4px 8px; border-radius: 8px; } }
.brand .divider { width: 1px; height: 22px; background: var(--rule); }
.brand .subtitle { font-size: 13.5px; color: var(--ink-3); font-weight: 500; white-space: nowrap; }
.nav-wrap { position: relative; display: flex; align-items: center; min-width: 0; margin-left: auto; --fade-l: 0px; --fade-r: 0px; }
.header-nav { position: relative; display: flex; gap: 4px; width: 100%; min-width: 0; overflow-x: auto; scrollbar-width: none; -webkit-mask-image: linear-gradient(90deg, transparent, #000 var(--fade-l), #000 calc(100% - var(--fade-r)), transparent); mask-image: linear-gradient(90deg, transparent, #000 var(--fade-l), #000 calc(100% - var(--fade-r)), transparent); }
.header-nav::-webkit-scrollbar { display: none; }
.nav-wrap.can-prev { --fade-l: 44px; } .nav-wrap.can-next { --fade-r: 44px; }
.nav-scroll { position: absolute; top: 50%; transform: translateY(-50%); z-index: 1; width: 28px; height: 28px; padding: 0; border-radius: 50%; border: 1px solid var(--rule); background: var(--surface); color: var(--ink-2); box-shadow: var(--shadow); cursor: pointer; display: none; place-items: center; }
.nav-scroll .ms { font-size: 18px; vertical-align: 0; }
.nav-scroll.prev { left: 0; } .nav-scroll.next { right: 0; }
.nav-wrap.can-prev .nav-scroll.prev, .nav-wrap.can-next .nav-scroll.next { display: grid; }
.nav-scroll:hover { color: var(--accent-text); border-color: var(--accent-text); }
.nav-scroll:active { transform: translateY(calc(-50% + 1px)); }
.header-nav a { flex: 0 0 auto; position: relative; font-size: 13.5px; font-weight: 500; color: var(--ink-3); text-decoration: none; padding: 7px 10px; border-radius: 999px; transition: color .12s, background .12s; }
.header-nav a:hover { color: var(--accent-text); background: var(--surface-2); }
.header-nav a.current { color: var(--accent-on-tint); background: var(--surface-3); }
.header-nav a.suggested::after { content: ""; position: absolute; top: 5px; right: 5px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent-fill); }
.header-actions { display: flex; align-items: center; gap: 8px; }
.lang-switch { display: inline-flex; border: 1px solid var(--rule); border-radius: 999px; overflow: hidden; background: var(--surface-2); }
.lang-btn { border: 0; background: transparent; padding: 7px 14px; font-size: 13px; font-weight: 600; color: var(--ink-3); cursor: pointer; }
.lang-btn.active { background: var(--accent-fill); color: #fff; }
@media (prefers-color-scheme: dark) { .lang-btn.active { color: #121417; } }

/* ---------- layout ---------- */
.page { max-width: 1180px; margin: 0 auto; padding: 0 24px 80px; display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 48px; }
.rail { position: sticky; top: 84px; align-self: start; padding-top: 36px; }
.rail ol { list-style: none; margin: 0; padding: 0; border-left: 2px solid var(--rule-2); }
.rail li a { display: block; padding: 7px 0 7px 14px; margin-left: -2px; border-left: 2px solid transparent; font-size: 13.5px; color: var(--ink-3); text-decoration: none; line-height: 1.4; }
.rail li a:hover { color: var(--accent-text); }
.rail li a.current { color: var(--accent-text); border-left-color: var(--accent-fill); font-weight: 600; }
.rail li a.suggested { font-weight: 600; color: var(--ink); }
.rail .rail-note { margin-top: 18px; font-size: 12.5px; color: var(--ink-3); line-height: 1.5; }
.content { min-width: 0; }
section.chapter { padding: 56px 0 8px; border-top: 1px solid var(--rule-2); margin-top: 48px; }
section.chapter:first-of-type { border-top: 0; margin-top: 0; }
.eyebrow { font-size: 12.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent-text); margin-bottom: 8px; }
.intro { font-size: 16.5px; line-height: 1.75; color: var(--ink-2); max-width: 760px; margin: 12px 0 28px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; border: 1px solid transparent; white-space: nowrap; }
.pill-accent { background: var(--surface-3); color: var(--accent-on-tint); border-color: var(--accent-border); }
.pill-ok { background: var(--surface-4); color: var(--ok-text); border-color: var(--ok-border); }
.pill-warn { background: var(--surface-5); color: var(--warn-text); border-color: var(--warn-border); }
.pill-muted { background: var(--surface-2); color: var(--ink-3); border-color: var(--rule); }
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 20px 22px; }
.card.soft { background: var(--surface-2); }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.callout { background: var(--surface-5); border: 1px solid var(--warn-border); border-radius: var(--radius); padding: 14px 18px; font-size: 14.5px; color: var(--ink-2); margin-top: 18px; }
.callout.info { background: var(--surface-3); border-color: var(--accent-border); }

/* ---------- hero ---------- */
.hero { padding: 44px 0 8px; }
.hero .lead { font-size: 18px; line-height: 1.8; color: var(--ink-2); max-width: 760px; margin: 18px 0 10px; }
.hero .lead-sub { font-size: 15.5px; line-height: 1.8; color: var(--ink-3); max-width: 760px; margin-bottom: 26px; }
.role-switch { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 0 0 22px; }
.role-switch .label { font-size: 13.5px; font-weight: 600; color: var(--ink-3); margin-right: 2px; }
.role-btn { border: 1px solid var(--rule); background: var(--surface); color: var(--ink-2); padding: 9px 16px; border-radius: 999px; font-size: 14px; font-weight: 600; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; transition: border-color .12s, background .12s; }
.role-btn:hover { border-color: var(--accent-text); color: var(--accent-text); }
.role-btn[aria-pressed="true"] { background: var(--accent-fill); border-color: var(--accent-fill); color: #fff; }
@media (prefers-color-scheme: dark) { .role-btn[aria-pressed="true"] { color: #121417; } }
.role-path { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; background: var(--surface-3); border: 1px solid var(--accent-border); border-radius: var(--radius-s); padding: 12px 16px; font-size: 14px; color: var(--ink-2); margin-bottom: 26px; }
.role-path a { font-weight: 600; }
.role-path .step-n { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--accent-fill); color: #fff; font-size: 11.5px; font-weight: 700; margin-right: 6px; }
@media (prefers-color-scheme: dark) { .role-path .step-n { color: #121417; } }

/* loop strip (signature) */
.loop { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin: 6px 0 14px; }
.loop-card { text-align: left; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 16px 16px 14px; cursor: pointer; transition: border-color .15s, box-shadow .15s, background .15s; display: flex; flex-direction: column; gap: 10px; }
.loop-card:hover { border-color: var(--accent-border); box-shadow: var(--shadow); }
.loop-card[aria-pressed="true"] { border-color: var(--accent-fill); background: var(--surface-3); }
.loop-head { display: flex; align-items: center; gap: 10px; }
.loop-num { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--surface-3); color: var(--accent-on-tint); font-size: 12px; font-weight: 700; }
.loop-card[aria-pressed="true"] .loop-num { background: var(--accent-fill); color: #fff; }
@media (prefers-color-scheme: dark) { .loop-card[aria-pressed="true"] .loop-num { color: #121417; } }
.loop-name { font-weight: 700; font-size: 15px; color: var(--ink); }
.loop-desc { font-size: 13.5px; line-height: 1.6; color: var(--ink-3); }
.artifact { background: var(--surface-2); border: 1px solid var(--rule-2); border-radius: 10px; padding: 10px 12px; font-size: 12.5px; line-height: 1.55; color: var(--ink-2); min-height: 118px; }
.artifact .a-title { display: flex; justify-content: space-between; align-items: center; font-weight: 700; color: var(--ink); margin-bottom: 6px; font-size: 12.5px; }
.artifact .a-title .mono { color: var(--ink-3); font-weight: 500; }
.artifact ul { margin: 0; padding-left: 16px; }
.artifact li { margin: 1px 0; }
.artifact .proceed { display: inline-block; margin-top: 7px; background: var(--accent-fill); color: #fff; font-size: 11.5px; font-weight: 700; padding: 3px 10px; border-radius: 6px; }
@media (prefers-color-scheme: dark) { .artifact .proceed { color: #121417; } }
.artifact .log { font-family: var(--font-mono); font-size: 11.5px; }
.artifact .log .ok { color: var(--ok-text); }
.artifact .log .run { color: var(--accent-text); }
.artifact .bar { height: 6px; background: var(--rule-2); border-radius: 3px; overflow: hidden; margin-top: 8px; }
.artifact .bar i { display: block; height: 100%; width: 72%; background: var(--accent-fill); }
.artifact .browser { background: #fff; border: 1px solid var(--rule); border-radius: 6px; padding: 4px; }
.artifact .browser svg { width: 100%; height: auto; display: block; }
.loop-foot { font-size: 13px; color: var(--ink-3); margin-bottom: 26px; }
.loop-request { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; background: var(--surface-2); border: 1px solid var(--rule); border-radius: 12px; padding: 12px 16px; margin: 0 0 12px; font-size: 15px; color: var(--ink); }
.loop-request > .ms { color: var(--accent-text); }
.loop-request .lbl { font-size: 12.5px; font-weight: 700; color: var(--accent-text); }
.artifact .flow { display: flex; align-items: flex-start; gap: 2px; margin: 8px 0 12px; }
.artifact .flow-step { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 5px; text-align: center; font-size: 12px; line-height: 1.35; color: var(--ink-2); }
.artifact .flow-ic { width: 38px; height: 38px; border-radius: 10px; background: var(--surface); border: 1px solid var(--accent-border); color: var(--accent-text); display: grid; place-items: center; }
.artifact .flow-ic .ms { vertical-align: 0; }
.artifact .flow-arrow { flex: 0 0 auto; font-size: 16px; color: var(--ink-3); margin-top: 11px; vertical-align: 0; }
.artifact .plan-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.artifact .plan-foot .proceed { margin-top: 0; }
.artifact .note { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--ink-3); }
.artifact .steps-list { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 7px; font-size: 13px; }
.artifact .steps-list li { display: flex; align-items: center; gap: 7px; margin: 0; }
.artifact .steps-list li.done .ms { color: var(--ok-text); }
.artifact .steps-list li.run { color: var(--accent-text); font-weight: 600; }
.artifact .pct { font-size: 11.5px; color: var(--ink-3); margin-top: 5px; text-align: right; }
.artifact .verify-lines { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; }
.artifact .verify-lines div { display: flex; align-items: center; gap: 6px; }
.artifact .verify-lines .ms { color: var(--ok-text); }

/* track comparison */
.tracks { display: grid; grid-template-columns: 1.15fr 1fr; gap: 14px; margin-top: 8px; }
.track { border: 1px solid var(--rule); border-radius: var(--radius); padding: 18px 20px; background: var(--surface-2); }
.track.primary { background: var(--surface); border-color: var(--accent-border); box-shadow: var(--shadow); }
.track h3 { font-size: 16px; margin-bottom: 8px; display: flex; gap: 8px; align-items: center; }
.track p { font-size: 14.5px; line-height: 1.7; }

/* ---------- what's new ---------- */
.news { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; border: 1px solid var(--rule); border-radius: var(--radius); overflow: hidden; }
.news li { display: grid; grid-template-columns: 112px 1fr; gap: 16px; padding: 14px 18px; border-top: 1px solid var(--rule-2); background: var(--surface); align-items: start; }
.news li:first-child { border-top: 0; }
.news time { font-family: var(--font-mono); font-size: 12.5px; color: var(--ink-3); padding-top: 3px; white-space: nowrap; }
.news .n-title { font-weight: 600; color: var(--ink); font-size: 15px; }
.news .n-desc { font-size: 14px; color: var(--ink-2); margin-top: 2px; }
.news .n-link { font-size: 13px; margin-top: 4px; }

/* ---------- use cases ---------- */
.uc-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 20px; }
.uc-list { display: flex; flex-direction: column; gap: 10px; }
.uc-card { display: flex; gap: 14px; align-items: flex-start; text-align: left; width: 100%; border: 1px solid var(--rule); background: var(--surface); border-radius: 12px; padding: 14px 16px; cursor: pointer; transition: border-color .15s, background .15s, box-shadow .15s; }
.uc-card:hover { border-color: var(--accent-text); box-shadow: var(--shadow); }
.uc-card[aria-pressed="true"] { border-color: var(--accent-fill); background: var(--surface-3); }
.uc-card .ms { color: var(--accent-text); font-size: 24px; flex-shrink: 0; margin-top: 2px; }
.uc-name { display: block; font-weight: 700; font-size: 15px; color: var(--ink); }
.uc-sub { display: block; font-size: 13.5px; line-height: 1.55; color: var(--ink-3); }
.uc-preview { border: 1px solid var(--rule); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
.uc-visual { background: var(--surface-2); padding: 18px; border-bottom: 1px solid var(--rule-2); }
.uc-visual svg { width: 100%; height: auto; display: block; max-width: 460px; margin: 0 auto; }
.uc-body { padding: 18px 20px; }
.uc-label { font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 7px; }
.uc-prompt { background: var(--surface-3); border: 1px solid var(--accent-border); border-radius: 10px; padding: 12px 15px; font-size: 14.5px; line-height: 1.7; color: var(--ink-2); margin-bottom: 14px; }
.uc-results { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-size: 14.5px; color: var(--ink-2); }
.uc-results li { display: flex; gap: 9px; align-items: flex-start; }
.uc-results li .ms { color: var(--ok-text); flex-shrink: 0; }

/* ---------- steps (section 01) ---------- */
.steps-bar { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--rule); border-radius: var(--radius) var(--radius) 0 0; overflow: hidden; background: var(--surface-2); }
.step-btn { display: flex; gap: 14px; align-items: center; text-align: left; padding: 16px 18px; border: 0; border-right: 1px solid var(--rule); background: transparent; cursor: pointer; }
.step-btn:last-child { border-right: 0; }
.step-btn:hover { background: var(--surface-3); }
.step-btn[aria-pressed="true"] { background: var(--surface); box-shadow: inset 0 -3px 0 var(--accent-fill); }
.step-circle { width: 32px; height: 32px; border-radius: 50%; background: var(--rule-2); color: var(--ink); font-weight: 700; font-size: 14px; display: grid; place-items: center; flex-shrink: 0; }
.step-btn[aria-pressed="true"] .step-circle { background: var(--accent-fill); color: #fff; }
@media (prefers-color-scheme: dark) { .step-btn[aria-pressed="true"] .step-circle { color: #121417; } }
.step-name { font-weight: 700; font-size: 15px; color: var(--ink); }
.step-sub { font-size: 12.5px; color: var(--ink-3); line-height: 1.4; }
.step-panel { border: 1px solid var(--rule); border-top: 0; border-radius: 0 0 var(--radius) var(--radius); padding: 22px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; background: var(--surface); }
.step-panel[hidden] { display: none; }
.role-card { border-radius: 12px; padding: 16px 18px; font-size: 14.5px; line-height: 1.7; color: var(--ink-2); }
.role-you { background: var(--surface-3); border: 1px solid var(--accent-border); }
.role-agent { background: var(--surface-4); border: 1px solid var(--ok-border); }
.role-card .rc-title { font-weight: 700; margin-bottom: 4px; display: flex; gap: 6px; align-items: center; }
.role-you .rc-title { color: var(--accent-on-tint); } .role-agent .rc-title { color: var(--ok-text); }
.example { grid-column: 1 / -1; background: var(--surface-2); border: 1px solid var(--rule); border-radius: 12px; padding: 16px 18px; font-size: 14px; line-height: 1.75; color: var(--ink-2); }
.example .ex-title { font-weight: 700; color: var(--ink); border-bottom: 1px solid var(--rule); padding-bottom: 8px; margin-bottom: 10px; }

/* ---------- surfaces (section 02) ---------- */
.pills { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.surface-pill { font-size: 14px; font-weight: 600; padding: 10px 18px; border-radius: 999px; border: 1px solid var(--rule); background: var(--surface-2); color: var(--ink-2); cursor: pointer; }
.surface-pill:hover { border-color: var(--accent-text); color: var(--accent-text); }
.surface-pill[aria-pressed="true"] { background: var(--accent-fill); color: #fff; border-color: var(--accent-fill); }
@media (prefers-color-scheme: dark) { .surface-pill[aria-pressed="true"] { color: #121417; } }
.surface-panel { display: grid; grid-template-columns: 1.2fr 1fr; gap: 22px; border: 1px solid var(--rule); border-radius: var(--radius); padding: 24px; background: var(--surface); }
.surface-panel[hidden] { display: none; }
.surface-panel .who { font-size: 13px; font-weight: 600; color: var(--accent-text); margin-bottom: 6px; }
.surface-panel h3 { font-size: 20px; margin-bottom: 10px; }
.surface-panel p { font-size: 14.5px; }
.points { background: var(--surface-2); border: 1px solid var(--rule); border-radius: 12px; padding: 16px 18px; }
.points .p-title { font-weight: 700; font-size: 13.5px; margin-bottom: 8px; color: var(--ink); }
.points ul { margin: 0; padding-left: 18px; font-size: 13.8px; color: var(--ink-2); display: flex; flex-direction: column; gap: 8px; }
.table-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: var(--radius); margin-top: 22px; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 14px; text-align: left; }
table.tbl caption { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
table.tbl th, table.tbl td { padding: 12px 14px; border-bottom: 1px solid var(--rule-2); vertical-align: top; color: var(--ink-2); }
table.tbl th { background: var(--surface-2); font-weight: 700; color: var(--ink); white-space: nowrap; }
table.tbl tr:last-child td { border-bottom: 0; }
table.tbl td:first-child { font-weight: 600; color: var(--ink); }
table.tbl .mono { font-size: 12.5px; color: var(--ink-3); }

/* ---------- features (section 03) ---------- */
.features { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.feature { border: 1px solid var(--rule); border-radius: var(--radius); padding: 20px 22px; background: var(--surface); display: grid; grid-template-columns: 40px 1fr; gap: 14px; align-items: start; }
.feature .f-icon { width: 40px; height: 40px; border-radius: 10px; background: var(--surface-3); color: var(--accent-on-tint); display: grid; place-items: center; }
.feature h3 { font-size: 16px; margin-bottom: 6px; }
.feature p { font-size: 14px; line-height: 1.7; }

/* ---------- architecture (section 04) ---------- */
.tiers { display: flex; flex-direction: column; gap: 12px; }
.tier { border: 1.5px solid var(--rule); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
.tier.active { border-color: var(--accent-fill); background: var(--surface-3); }
.tier-toggle { display: block; width: 100%; text-align: left; background: transparent; border: 0; padding: 18px 22px; cursor: pointer; }
.tier-toggle:focus-visible { border-radius: 12px; }
.tier-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.tier-title { font-weight: 700; font-size: 16px; color: var(--ink); display: flex; gap: 10px; align-items: center; }
.tier-title .ms { color: var(--accent-text); }
.tier-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.chip { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 5px 11px; font-size: 13px; font-weight: 500; color: var(--ink-2); }
.tier-detail { margin: 0 22px; padding: 14px 0 20px; border-top: 1px solid var(--accent-border); font-size: 14.5px; line-height: 1.75; color: var(--ink-2); }
.tier-detail[hidden] { display: none; }
.tier-toggle .ms.chev { transition: transform .15s; color: var(--ink-3); }
.tier.active .tier-toggle .ms.chev { transform: rotate(180deg); }

/* ---------- cost (section 05) ---------- */
.values { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-bottom: 20px; }
.value { background: var(--surface-2); border: 1px solid var(--rule); border-radius: var(--radius); padding: 18px 20px; }
.value .v-title { font-size: 16px; font-weight: 700; color: var(--accent-text); margin-bottom: 8px; word-break: keep-all; }
.value p { font-size: 14px; line-height: 1.7; }
.calc { border: 1px solid var(--accent-border); background: var(--surface); border-radius: var(--radius); padding: 22px; display: grid; grid-template-columns: 1fr 1.2fr; gap: 24px; box-shadow: var(--shadow); }
.calc h3 { font-size: 17px; margin-bottom: 6px; }
.calc .c-sub { font-size: 13.5px; color: var(--ink-3); margin-bottom: 16px; }
.calc label { display: block; font-size: 13px; font-weight: 600; color: var(--ink-2); margin: 10px 0 6px; }
.calc input[type="number"] { width: 100%; font: inherit; font-size: 16px; padding: 10px 12px; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); color: var(--ink); }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 999px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 8px 14px; font-size: 14px; font-weight: 600; color: var(--ink-3); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent-fill); color: #fff; }
@media (prefers-color-scheme: dark) { .seg button[aria-pressed="true"] { color: #121417; } }
.calc-out { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-content: start; }
.calc-out .kpi { background: var(--surface-2); border: 1px solid var(--rule); border-radius: 12px; padding: 14px 16px; }
.calc-out .kpi .k { font-size: 12.5px; color: var(--ink-3); font-weight: 600; }
.calc-out .kpi .v { font-size: 24px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; margin-top: 2px; }
.calc-out .kpi .u { font-size: 12.5px; color: var(--ink-3); }
.calc-out .note { grid-column: 1 / -1; font-size: 13px; line-height: 1.6; color: var(--ink-3); }
.checklist { margin-top: 20px; }

/* ---------- FAQ (section 06) ---------- */
.faq { display: flex; flex-direction: column; gap: 12px; }
.faq-item { border: 1px solid var(--rule); border-radius: var(--radius); background: var(--surface); padding: 18px 22px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; }
.faq-q { font-size: 16.5px; font-weight: 700; color: var(--ink); }
.faq-a { grid-column: 1 / -1; font-size: 15px; line-height: 1.75; color: var(--ink-2); }
.faq-docs { grid-column: 1 / -1; font-size: 13.5px; color: var(--ink-3); }
.faq-docs a { margin-right: 10px; }

/* ---------- footer ---------- */
.site-footer { border-top: 1px solid var(--rule-2); background: var(--surface-2); }
.footer-inner { max-width: 1180px; margin: 0 auto; padding: 36px 24px 48px; display: grid; grid-template-columns: 1.3fr 1fr; gap: 32px; font-size: 13.5px; color: var(--ink-3); }
.footer-inner h4 { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 10px; }
.footer-inner ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.footer-inner .meta { margin-top: 14px; font-size: 12.5px; line-height: 1.6; }

/* ---------- external links ---------- */
.content a[target="_blank"]::after, .site-footer a[target="_blank"]::after { content: " \2197"; font-size: .85em; }

/* ---------- header: single row on desktop ---------- */
@media (min-width: 741px) {
  .header-inner { flex-wrap: nowrap; }
  .brand, .header-actions { flex: 0 0 auto; }
  .nav-wrap { flex: 1 1 auto; margin-left: 4px; }
  .header-nav { justify-content: flex-start; gap: 2px; }
  .site-header.compact-2 .header-nav { gap: 0; }
  .site-header.compact-2 .header-nav a { padding: 6px 6px; }
  .site-header.compact-3 .brand img { height: 26px; }
  .site-header.compact-3 .lang-btn { padding: 7px 11px; }
  .site-header.compact-3 .header-nav a { font-size: 12.5px; padding: 6px 5px; }
  .header-nav a { padding: 6px 8px; font-size: 13px; white-space: nowrap; }
  .lang-btn { white-space: nowrap; }
}
/* subtitle is shown only while the full section nav still fits (see fitHeader) */
.site-header.compact-1 .brand .divider, .site-header.compact-1 .brand .subtitle { display: none; }

/* ---------- responsive ---------- */
@media (max-width: 1080px) {
  .page { grid-template-columns: 1fr; gap: 0; }
  .rail { display: none; }
}
@media (max-width: 860px) {
  .uc-layout, .surface-panel, .calc, .footer-inner, .tracks { grid-template-columns: 1fr; }
  .features, .values, .loop { grid-template-columns: 1fr; }
  .loop .artifact { min-height: 0; }
  .steps-bar { grid-template-columns: 1fr; }
  .step-btn { border-right: 0; border-bottom: 1px solid var(--rule); }
  .step-btn:last-child { border-bottom: 0; }
  .step-panel { grid-template-columns: 1fr; }
}
@media (max-width: 740px) {
  body { font-size: 16px; }
  .header-inner { padding: 8px 14px; gap: 10px; }
  .brand .divider, .brand .subtitle { display: none; }
  .brand img { height: 26px; }
  .header-actions { margin-left: auto; }
  .nav-wrap { order: 3; width: 100%; margin-left: 0; }
  .header-nav { padding: 2px 0 4px; gap: 8px; }
  .nav-scroll { display: none !important; }
  .header-nav a { border: 1px solid var(--rule); background: var(--surface); padding: 7px 12px; font-size: 13px; color: var(--ink-2); }
  .header-nav a.current { background: var(--surface-3); color: var(--accent-on-tint); border-color: var(--accent-border); }
  .page { padding: 0 16px 60px; }
  .hero { padding-top: 28px; }
  section.chapter { padding-top: 40px; margin-top: 36px; }
  .news li { grid-template-columns: 1fr; gap: 2px; }
  .faq-item { grid-template-columns: 1fr; }
  .lang-btn { padding: 10px 14px; }
  .role-btn { padding: 10px 14px; }
  table.tbl { font-size: 14px; }
  .uc-visual svg { max-width: 100%; }
}
.hero .pill { white-space: normal; line-height: 1.5; } /* badge may wrap on small phones instead of overflowing */


  </style>
</head>

    /* ---------- section 05: cost ---------- */

    function calcValues() {
      const per = CREDIT[calcEdition]; const monthly = per * calcSeats; const weekly = per / 4 * calcSeats;

            <div class="kpi"><div class="k">${c.calcWeekly}</div><div class="v" id="calc-weekly">${fmt(v.weekly)}</div><div class="u">${c.calcUnit} / 7${currentLang === 'ko' ? '일' : ' days'}</div></div>

    /* ---------- render orchestration ---------- */
    const SECTIONS = { top: heroHTML, whatsnew: whatsNewHTML, usecases: useCasesHTML, overview: stepsHTML, surfaces: surfacesHTML, features: featuresHTML, architecture: architectureHTML, differentiation: costHTML, faq: faqHTML };
    function decorateExternalLinks(root) {
      const note = T().newTab;
      root.querySelectorAll('a[href^="http"]').forEach(a => {
        if (!a.hasAttribute('target')) { a.setAttribute('target', '_blank'); a.setAttribute('rel', 'noopener noreferrer'); }
        if (!a.querySelector('.sr-only')) a.insertAdjacentHTML('beforeend', `<span class="sr-only">${note}</span>`);
      });
    }
    function renderAll() {
      const c = T();
      document.getElementById('main-content').innerHTML = Object.values(SECTIONS).map(fn => fn(c)).join('');
      document.getElementById('rail-slot').innerHTML = railHTML(c);
      document.getElementById('site-footer').innerHTML = footerHTML(c);
      decorateExternalLinks(document.getElementById('main-content'));
      decorateExternalLinks(document.getElementById('site-footer'));
      applyRoleMarks(); setupObserver(); maybeAutoplay();
    }
    function rerender(id) {
      const c = T(); const el = document.getElementById(id);
      if (!el) return; const tmp = document.createElement('div'); tmp.innerHTML = SECTIONS[id](c);
      el.replaceWith(tmp.firstElementChild); decorateExternalLinks(document.getElementById(id)); setupObserver();
    }
    function refocus(sel) { const el = document.querySelector(sel); if (el) el.focus({ preventScroll: true }); }

    /* ---------- interactions ---------- */
    function setLoop(i, user) {
      loopIndex = i; if (user) { loopPlayed = true; if (loopTimer) { clearInterval(loopTimer); loopTimer = null; } }
      const c = T(); const el = document.getElementById('hero-loop'); if (el) el.innerHTML = renderLoopHTML(c);
      if (user) refocus('#hero-loop .loop-card[aria-pressed="true"]');
    }
    function maybeAutoplay() {
      if (loopPlayed || reduceMotion || loopTimer) return;
      loopTimer = setInterval(() => { if (loopIndex >= 2) { clearInterval(loopTimer); loopTimer = null; loopPlayed = true; return; } setLoop(loopIndex + 1, false); }, 2600);
    }
    function setRole(id) {
      activeRole = (activeRole === id) ? null : id;
      rerender('top'); applyRoleMarks(); refocus(`.role-btn[aria-pressed="true"]`);
      const p = document.getElementById('role-path'); if (p && !reduceMotion) p.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
    function applyRoleMarks() {
      const c = T(); const r = c.roles.find(x => x.id === activeRole); const set = new Set(r ? r.path.map(p => p[0]) : []);
      document.querySelectorAll('.header-nav a, .rail a').forEach(a => a.classList.toggle('suggested', set.has(a.getAttribute('href'))));
    }
    function setUseCase(i) { activeUseCase = i; rerender('usecases'); refocus('.uc-card[aria-pressed="true"]'); }
    function setStep(i) { activeStep = i; rerender('overview'); refocus('.step-btn[aria-pressed="true"]'); }
    function setSurface(i) { activeSurface = i; rerender('surfaces'); refocus('.surface-pill[aria-pressed="true"]'); }
    function setTier(i) { activeTier = (activeTier === i) ? -1 : i; rerender('architecture'); refocus(`.tier:nth-child(${i + 1}) .tier-toggle`); }
    function setSeats(v) { const n = Math.max(1, Math.min(100000, parseInt(v, 10) || 1)); calcSeats = n; updateCalc(); }
    function setEdition(k) { calcEdition = k; document.querySelectorAll('#calc .seg button').forEach(b => b.setAttribute('aria-pressed', b.getAttribute('onclick').includes(`'${k}'`))); updateCalc(); }
    function updateCalc() { const v = calcValues(); const m = document.getElementById('calc-monthly'), w = document.getElementById('calc-weekly'); if (m) m.textContent = fmt(v.monthly); if (w) w.textContent = fmt(v.weekly); }
    function setLang(lang) {
      currentLang = lang; document.documentElement.lang = lang; document.title = T().pageTitle;
      document.getElementById('btn-ko').classList.toggle('active', lang === 'ko'); document.getElementById('btn-en').classList.toggle('active', lang === 'en');
      document.getElementById('btn-ko').setAttribute('aria-pressed', lang === 'ko'); document.getElementById('btn-en').setAttribute('aria-pressed', lang === 'en');
      document.querySelectorAll('[data-ko]').forEach(el => { const v = el.getAttribute('data-' + lang); if (el.hasAttribute('data-attr')) el.setAttribute(el.getAttribute('data-attr'), v); else el.textContent = v; });
      renderNav(); renderAll();
    }
    function renderNav() {
      const c = T(); document.getElementById('header-nav').innerHTML = c.navItems.map(([h, l]) => `<a href="${h}">${l}</a>`).join('');
      fitHeader();
    }

    /* ---------- header: fit the section nav to the available width ---------- */
    function navEl() { return document.getElementById('header-nav'); }
    function navOverflows(nav) { return nav.scrollWidth > nav.clientWidth + 1; }
    function updateNavEdges() {
      const nav = navEl(); if (!nav) return; const wrap = nav.parentElement; const max = nav.scrollWidth - nav.clientWidth;
      wrap.classList.toggle('can-prev', nav.scrollLeft > 2);
      wrap.classList.toggle('can-next', max - nav.scrollLeft > 2);
    }
    function fitHeader() {
      const nav = navEl(); if (!nav) return; const header = document.querySelector('.site-header');
      header.classList.remove('compact-1', 'compact-2', 'compact-3');
      if (window.innerWidth > 740) {
        if (navOverflows(nav)) header.classList.add('compact-1');   // 1. drop the brand subtitle
        if (navOverflows(nav)) header.classList.add('compact-2');   // 2. tighten chip padding
        if (navOverflows(nav)) header.classList.add('compact-3');   // 3. smaller logo / chips
      }                                                             // 4. still too wide -> scroll with fades + chevrons
      updateNavEdges();
    }
    function scrollNav(dir) {
      const nav = navEl(); nav.scrollBy({ left: dir * Math.round(nav.clientWidth * 0.6), behavior: reduceMotion ? 'auto' : 'smooth' });
    }
    function revealCurrentNav() {
      const nav = navEl(); const cur = nav && nav.querySelector('a.current');
      if (!cur || !navOverflows(nav)) return;
      const left = cur.offsetLeft - (nav.clientWidth - cur.offsetWidth) / 2;
      nav.scrollTo({ left: Math.max(0, left), behavior: reduceMotion ? 'auto' : 'smooth' });
    }

    /* ---------- scroll spy ---------- */
    let observer = null;
    function setupObserver() {
      if (observer) observer.disconnect();
      const links = Array.from(document.querySelectorAll('.header-nav a, .rail a'));
      const ids = Array.from(new Set(links.map(a => a.getAttribute('href').slice(1))));
      observer = new IntersectionObserver(entries => {
        const vis = entries.filter(e => e.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0];
        if (!vis) return; const id = '#' + vis.target.id;
        links.forEach(a => a.classList.toggle('current', a.getAttribute('href') === id));
        revealCurrentNav();
      }, { rootMargin: '-35% 0px -55% 0px', threshold: 0 });
      ids.forEach(id => { const s = document.getElementById(id); if (s) observer.observe(s); });
    }

    /* ---------- boot ---------- */
    renderNav(); renderAll();
    navEl().addEventListener('scroll', updateNavEdges, { passive: true });
    window.addEventListener('resize', () => requestAnimationFrame(fitHeader));
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitHeader);
    if (window.location.hash) { const t = document.querySelector(window.location.hash); if (t) requestAnimationFrame(() => t.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' })); }

  </script>
</body>
</html>
