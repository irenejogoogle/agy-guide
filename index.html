  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --g-blue: #1a73e8;
      --g-blue-bg: #f0f6ff;
      --g-blue-border: #d2e3fc;
      --g-green: #188038;
      --g-green-bg: #eef9f1;
      --g-green-border: #ceead6;
      --g-yellow: #b06000;
      --g-yellow-bg: #fef7e0;
      --g-yellow-border: #feefc3;
      --g-red: #c5221f;
      --g-red-bg: #fce8e6;

      --text-main: #202124;
      --text-body: #3c4043;
      --text-muted: #5f6368;
      --bg-page: #ffffff;
      --bg-surface: #f8f9fa;
      --border-light: #e8eaed;
      --border-std: #dadce0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans KR', 'Google Sans', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      line-height: 1.74;
      word-break: keep-all;
      -webkit-font-smoothing: antialiased;
    }

    code, pre {
      font-family: 'Roboto Mono', monospace;
      font-size: 0.92em;
      background: #f1f3f4;
      padding: 2px 6px;
      border-radius: 5px;
    }

    .google-top-stripe {
      height: 4px;
      width: 100%;
      background: linear-gradient(90deg, #4285F4 0% 25%, #EA4335 25% 50%, #FBBC04 50% 75%, #34A853 75% 100%);
    }

    /* Editorial Header */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-light);
      padding: 14px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand-lockup {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-lockup img.official-lockup {
      height: 32px;
      width: auto;
      display: block;
    }

    .header-divider {
      width: 1px;
      height: 20px;
      background: var(--border-std);
    }

    .header-subtitle {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .header-nav {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .header-nav a {
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-muted);
      transition: color 0.15s;
    }

    .header-nav a:hover {
      color: var(--g-blue);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .lang-switch {
      display: inline-flex;
      border: 1px solid var(--border-std);
      border-radius: 999px;
      overflow: hidden;
      background: var(--bg-surface);
    }

    .lang-btn {
      border: none;
      background: transparent;
      padding: 6px 14px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
    }

    .lang-btn.active {
      background: var(--g-blue);
      color: #ffffff;
    }

    /* Main Wrapper */
    .guide-wrapper {
      max-width: 980px;
      margin: 0 auto;
      padding: 48px 28px 96px;
    }

    /* Hero Section */
    .hero-block {
      padding-bottom: 44px;
      border-bottom: 1px solid var(--border-light);
      margin-bottom: 48px;
    }

    .hero-brand-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .hero-brand-row img {
      height: 42px;
      width: auto;
    }

    .pill-label {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      color: var(--g-blue);
      background: var(--g-blue-bg);
      padding: 4px 12px;
      border-radius: 999px;
    }

    .hero-block h1 {
      font-size: 33px;
      line-height: 1.34;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 16px;
      letter-spacing: -0.02em;
    }

    .hero-block p.lead {
      font-size: 18px;
      line-height: 1.85;
      color: var(--text-body);
      max-width: 740px;
      margin-bottom: 14px;
      letter-spacing: -0.006em;
    }

    .hero-block p.lead-sub {
      font-size: 15.5px;
      line-height: 1.8;
      color: var(--text-muted);
      max-width: 740px;
      margin-bottom: 30px;
      letter-spacing: -0.004em;
    }

    /* Hero: Plan -> Act -> Verify mini cards */
    .hero-flow-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 30px;
    }

    @media (max-width: 740px) {
      .hero-flow-row {
        grid-template-columns: 1fr;
      }
    }

    .hero-flow-card {
      position: relative;
      background: #ffffff;
      border: 1px solid var(--border-std);
      border-radius: 12px;
      padding: 16px 18px 17px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .hero-flow-card:hover {
      border-color: var(--g-blue-border);
      box-shadow: 0 2px 10px rgba(26,115,232,0.08);
    }

    .hero-flow-card .flow-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--g-blue-bg);
      color: var(--g-blue);
      font-size: 11.5px;
      font-weight: 700;
      margin-bottom: 9px;
    }

    .hero-flow-card .flow-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 5px;
      letter-spacing: -0.01em;
    }

    .hero-flow-card .flow-desc {
      font-size: 13.5px;
      line-height: 1.65;
      color: var(--text-muted);
    }

    .hero-track-heading {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .concept-comparison-box {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      background: var(--bg-surface);
      border: 1px solid var(--border-std);
      border-radius: 16px;
      padding: 24px;
    }

    @media (max-width: 740px) {
      .concept-comparison-box {
        grid-template-columns: 1fr;
      }
      .header-nav {
        display: none;
      }
    }

    .concept-col {
      padding: 8px;
    }

    .concept-col.highlight {
      background: #ffffff;
      border: 1px solid var(--g-blue-border);
      border-radius: 12px;
      padding: 18px 20px;
      box-shadow: 0 2px 8px rgba(26,115,232,0.06);
    }

    .concept-col h3 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .concept-col p {
      font-size: 14.5px;
      color: var(--text-body);
    }

    /* Chapters */
    .chapter {
      margin-bottom: 56px;
      padding-bottom: 48px;
      border-bottom: 1px solid var(--border-light);
    }

    .chapter:last-child {
      border-bottom: none;
      margin-bottom: 0;
    }

    .chapter-number {
      font-size: 12.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--g-blue);
      margin-bottom: 6px;
    }

    .chapter h2 {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 12px;
      letter-spacing: -0.01em;
    }

    .chapter p.section-intro {
      font-size: 15.5px;
      color: var(--text-body);
      margin-bottom: 26px;
      max-width: 860px;
    }

    /* INTERACTIVE DIAGRAM 1: Plan -> Act -> Verify */
    .flow-diagram-box {
      border: 1px solid var(--border-std);
      border-radius: 16px;
      background: #ffffff;
      overflow: hidden;
    }

    .flow-steps-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-std);
    }

    .flow-step-btn {
      padding: 18px 20px;
      border: none;
      border-right: 1px solid var(--border-std);
      background: transparent;
      text-align: left;
      cursor: pointer;
      transition: background 0.15s;
      display: flex;
      align-items: center;
      gap: 14px;
      font-family: inherit;
    }

    .flow-step-btn:last-child {
      border-right: none;
    }

    .flow-step-btn:hover {
      background: #f1f3f4;
    }

    .flow-step-btn.active {
      background: #ffffff;
      border-bottom: 3px solid var(--g-blue);
    }

    .step-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #e8eaed;
      color: var(--text-main);
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .flow-step-btn.active .step-circle {
      background: var(--g-blue);
      color: #ffffff;
    }

    .flow-content-panel {
      padding: 28px;
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 26px;
      align-items: center;
    }

    @media (max-width: 760px) {
      .flow-steps-bar, .flow-content-panel {
        grid-template-columns: 1fr;
      }
    }

    .role-split {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .role-card {
      padding: 16px 18px;
      border-radius: 12px;
      font-size: 14px;
    }

    .role-you {
      background: var(--g-blue-bg);
      border: 1px solid var(--g-blue-border);
    }

    .role-agent {
      background: var(--g-green-bg);
      border: 1px solid var(--g-green-border);
    }

    .visual-example-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-std);
      border-radius: 12px;
      padding: 20px;
      font-size: 13.5px;
    }

    /* INTERACTIVE DIAGRAM 2: 4 Surfaces Tabs */
    .surface-tabs-row {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .surface-pill {
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 999px;
      border: 1px solid var(--border-std);
      background: var(--bg-surface);
      color: var(--text-body);
      cursor: pointer;
      transition: all 0.15s;
    }

    .surface-pill:hover {
      border-color: var(--g-blue);
      color: var(--g-blue);
    }

    .surface-pill.active {
      background: var(--g-blue);
      color: #ffffff;
      border-color: var(--g-blue);
    }

    .surface-display-card {
      border: 1px solid var(--border-std);
      border-radius: 16px;
      padding: 28px;
      background: #ffffff;
      display: grid;
      grid-template-columns: 1.18fr 0.82fr;
      gap: 28px;
      align-items: center;
    }

    @media (max-width: 760px) {
      .surface-display-card {
        grid-template-columns: 1fr;
      }
    }

    .callout-note {
      margin-top: 16px;
      background: var(--g-yellow-bg);
      border: 1px solid var(--g-yellow-border);
      border-radius: 12px;
      padding: 14px 18px;
      font-size: 13.5px;
      color: var(--text-body);
    }

    /* Features Grid */
    .features-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    @media (max-width: 720px) {
      .features-grid {
        grid-template-columns: 1fr;
      }
    }

    .feature-item {
      border: 1px solid var(--border-std);
      border-radius: 14px;
      padding: 22px 24px;
      background: #ffffff;
    }

    .feature-item h3 {
      font-size: 16.5px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .feature-item p {
      font-size: 14px;
      color: var(--text-body);
    }

    /* INTERACTIVE DIAGRAM 3: 3-Layer Stack */
    .stack-diagram {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .stack-tier {
      border: 1.5px solid var(--border-std);
      border-radius: 14px;
      padding: 20px 24px;
      background: #ffffff;
      cursor: pointer;
      transition: all 0.18s;
    }

    .stack-tier:hover {
      border-color: var(--g-blue);
    }

    .stack-tier.active {
      border-color: var(--g-blue);
      background: var(--g-blue-bg);
    }

    .tier-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      gap: 12px;
    }

    .tier-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
    }

    .tier-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tier-chip {
      background: #ffffff;
      border: 1px solid var(--border-std);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-body);
    }

    .stack-explanation-panel {
      background: var(--bg-surface);
      border-left: 4px solid var(--g-blue);
      border-radius: 8px;
      padding: 20px 24px;
      font-size: 14.5px;
      color: var(--text-body);
    }

    /* Value Cards & Table */
    .value-highlights {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 28px;
    }

    @media (max-width: 760px) {
      .value-highlights {
        grid-template-columns: 1fr;
      }
    }

    .value-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-std);
      border-radius: 14px;
      padding: 20px;
    }

    .value-card .big-metric {
      font-size: 19px;
      font-weight: 700;
      color: var(--g-blue);
      margin-bottom: 8px;
    }

    .comparison-table-wrapper {
      overflow-x: auto;
      border: 1px solid var(--border-std);
      border-radius: 14px;
    }

    table.clean-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.8px;
      text-align: left;
    }

    table.clean-table th, table.clean-table td {
      padding: 15px 16px;
      border-bottom: 1px solid var(--border-light);
      vertical-align: top;
    }

    table.clean-table th {
      background: var(--bg-surface);
      font-weight: 700;
      color: var(--text-main);
    }

    table.clean-table th.agy-col, table.clean-table td.agy-col {
      background: var(--g-blue-bg);
      border-left: 1px solid var(--g-blue-border);
    }

    .verdict-badge {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 700;
    }

    .verdict-true {
      background: var(--g-green-bg);
      color: var(--g-green);
      border: 1px solid var(--g-green-border);
    }

    .verdict-caveat {
      background: var(--g-blue-bg);
      color: var(--g-blue);
      border: 1px solid var(--g-blue-border);
    }

    /* USE CASE SHOWCASE */
    .usecase-layout {
      display: grid;
      grid-template-columns: 0.92fr 1.08fr;
      gap: 22px;
      align-items: start;
    }

    @media (max-width: 860px) {
      .usecase-layout {
        grid-template-columns: 1fr;
      }
    }

    .usecase-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .usecase-card {
      display: flex;
      gap: 13px;
      align-items: flex-start;
      text-align: left;
      width: 100%;
      font-family: inherit;
      border: 1px solid var(--border-std);
      background: #ffffff;
      border-radius: 12px;
      padding: 15px 17px;
      cursor: pointer;
      transition: border-color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
    }

    .usecase-card:hover {
      border-color: var(--g-blue);
      box-shadow: 0 2px 10px rgba(26,115,232,0.08);
    }

    .usecase-card.active {
      border-color: var(--g-blue);
      background: var(--g-blue-bg);
      box-shadow: 0 2px 10px rgba(26,115,232,0.10);
    }

    .usecase-card .uc-icon {
      font-size: 19px;
      line-height: 1.35;
      flex-shrink: 0;
    }

    .usecase-card .uc-name {
      font-size: 14.8px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.01em;
      margin-bottom: 3px;
    }

    .usecase-card .uc-sub {
      font-size: 13px;
      line-height: 1.6;
      color: var(--text-muted);
    }

    .usecase-preview {
      border: 1px solid var(--border-std);
      border-radius: 16px;
      overflow: hidden;
      background: #ffffff;
    }

    .usecase-visual {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-light);
      padding: 18px;
      display: flex;
      justify-content: center;
    }

    .usecase-visual svg {
      width: 100%;
      max-width: 430px;
      height: auto;
      display: block;
    }

    .usecase-body {
      padding: 20px 22px 22px;
    }

    .uc-prompt {
      background: var(--g-blue-bg);
      border: 1px solid var(--g-blue-border);
      border-radius: 10px;
      padding: 12px 15px;
      font-size: 13.5px;
      line-height: 1.7;
      color: var(--text-body);
      margin-bottom: 16px;
    }

    .uc-label {
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 7px;
    }

    .uc-results {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 13.5px;
      line-height: 1.6;
      color: var(--text-body);
    }

    .uc-results li {
      display: flex;
      gap: 9px;
      align-items: flex-start;
    }

    .uc-results li::before {
      content: '\2713';
      color: var(--g-green);
      font-weight: 700;
      flex-shrink: 0;
    }
  </style>
</head>

        <!-- SECTION 3 -->
        <section class="chapter" id="features">
          <div class="chapter-number">${c.s3Num}</div>
          <h2>${c.s3Title}</h2>
          <p class="section-intro">${c.s3Intro}</p>

          <div class="features-grid">
            ${c.features.map(f => `
              <div class="feature-item">
                <h3><span style="color:${f.color};">${f.num}</span> ${f.title}</h3>
                <p>${f.desc}</p>
              </div>
            `).join('')}
          </div>
        </section>

        <!-- SECTION 4 -->
        <section class="chapter" id="architecture">
          <div class="chapter-number">${c.s4Num}</div>
          <h2>${c.s4Title}</h2>
          <p class="section-intro">${c.s4Intro}</p>

          <div class="stack-diagram">
            ${c.tiers.map((t, i) => `
              <div class="stack-tier ${i === activeTier ? 'active' : ''}" onclick="setTier(${i})">
                <div class="tier-header">
                  <span class="tier-title">${t.title}</span>
                  <span class="pill-label">${t.badge}</span>
                </div>
                <div class="tier-chips">
                  ${t.chips.map(ch => `<span class="tier-chip">${ch}</span>`).join('')}
                </div>
              </div>
            `).join('')}
          </div>

          <div class="stack-explanation-panel">
            ${c.tiers[activeTier].explanation}
          </div>
        </section>

        <!-- SECTION 5 -->
        <section class="chapter" id="differentiation">
          <div class="chapter-number">${c.s5Num}</div>
          <h2>${c.s5Title}</h2>
          <p class="section-intro">${c.s5Intro}</p>

          <div class="value-highlights">
            ${c.values.map(v => `
              <div class="value-card">
                <div class="big-metric" style="color:${v.color};">${v.metric}</div>
                <p style="font-size:13.5px;color:var(--text-body);">${v.desc}</p>
              </div>
            `).join('')}
          </div>

          <div class="comparison-table-wrapper">
            <table class="clean-table">
              <thead>
                <tr>
                  <th style="width:34%;">${c.tableHeaders[0]}</th>
                  <th class="agy-col" style="width:66%;">${c.tableHeaders[1]}</th>
                </tr>
              </thead>
              <tbody>
                ${c.tableRows.map(row => `
                  <tr>
                    <td>${row[0]}</td>
                    <td class="agy-col">${row[1]}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </section>

        <!-- SECTION 6 -->
        <section class="chapter" id="faq">
          <div class="chapter-number">${c.s6Num}</div>
          <h2>${c.s6Title}</h2>
          <p class="section-intro">${c.s6Intro}</p>

          <div class="comparison-table-wrapper">
            <table class="clean-table">
              <thead>
                <tr>
                  <th style="width:22%;">${c.factHeaders[0]}</th>
                  <th style="width:16%;">${c.factHeaders[1]}</th>
                  <th style="width:44%;">${c.factHeaders[2]}</th>
                  <th style="width:18%;">${c.factHeaders[3]}</th>
                </tr>
              </thead>
              <tbody>
                ${c.factRows.map(row => `
                  <tr>
                    <td>${row[0]}</td>
                    <td>${row[1]}</td>
                    <td>${row[2]}</td>
                    <td>${row[3]}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </section>
      `;
    }

    function setLang(lang) {
      currentLang = lang;
      document.documentElement.lang = lang;
      document.getElementById('btn-ko').classList.toggle('active', lang === 'ko');
      document.getElementById('btn-en').classList.toggle('active', lang === 'en');
      document.querySelectorAll('[data-ko]').forEach(el => {
        el.textContent = el.getAttribute('data-' + lang);
      });
      renderAll();
    }

    function setUseCase(idx) {
      activeUseCase = idx;
      renderAll();
    }

    function setStep(idx) {
      activeStep = idx;
      renderAll();
    }

    function setSurface(idx) {
      activeSurface = idx;
      renderAll();
    }

    function setTier(idx) {
      activeTier = idx;
      renderAll();
    }

    renderAll();
    if (window.location.hash) {
      const targetEl = document.querySelector(window.location.hash);
      if (targetEl) {
        requestAnimationFrame(() => targetEl.scrollIntoView({ behavior: 'smooth', block: 'start' }));
      }
    }
  </script>
</body>
</html>
